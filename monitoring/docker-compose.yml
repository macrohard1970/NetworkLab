# NetworkLab monitoring stack.
#
#   docker compose up -d                       # Prometheus + Grafana
#   docker compose --profile batfish up -d     # + Batfish
#   docker compose --profile dns up -d         # + dnsmasq
#   docker compose --profile suzieq up -d      # + SuzieQ (needs sshd on the FRR nodes)
#   docker compose down
#
# Deploy topology.clab.yml first: Containerlab creates the clab-netlab-mgmt network.
# Only Prometheus and Grafana run by default to keep the host small.
# Published ports bind to 127.0.0.1; use an SSH tunnel from another machine.

name: netlab-monitoring

networks:
  services:
    name: netlab-services
    ipam:
      config:
        - subnet: 10.20.0.0/24
  mgmt:
    name: clab-netlab-mgmt
    external: true

volumes:
  prometheus_data:
  grafana_data:
  suzieq_data:

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: netlab-prometheus
    restart: unless-stopped
    networks:
      services: {ipv4_address: 10.20.0.10}
      mgmt: {ipv4_address: 10.255.255.41}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: netlab-grafana
    restart: unless-stopped
    networks:
      services: {ipv4_address: 10.20.0.11}
      mgmt: {ipv4_address: 10.255.255.42}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Override with: export GRAFANA_ADMIN_PASSWORD=...  (lab default: admin)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # ── Optional ────────────────────────────────────────────────────────

  suzieq:
    profiles: [suzieq]
    image: netenglabs/suzieq:0.25.0
    container_name: netlab-suzieq
    restart: unless-stopped
    networks:
      services: {ipv4_address: 10.20.0.12}
      mgmt: {ipv4_address: 10.255.255.43}
    volumes:
      - suzieq_data:/home/suzieq/parquet
      - ./suzieq/inventory.yml:/home/suzieq/inventory.yml:ro
      - ./suzieq/ssh:/home/suzieq/.ssh:ro
    command: ["sq-poller", "-I", "/home/suzieq/inventory.yml"]

  batfish:
    profiles: [batfish]
    image: batfish/batfish:latest
    container_name: netlab-batfish
    restart: unless-stopped
    networks:
      services: {ipv4_address: 10.20.0.13}
    ports:
      - "127.0.0.1:9996:9996"   # pybatfish API

  dnsmasq:
    profiles: [dns]
    image: alpine:3.20
    container_name: netlab-dnsmasq
    restart: unless-stopped
    networks:
      services: {ipv4_address: 10.20.0.15}
      mgmt: {ipv4_address: 10.255.255.46}
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq/hosts:/etc/hosts.lab:ro
    # No host port: lab containers query it on 10.255.255.46. Publishing :53
    # on the host would clash with the host's own resolver.
    command: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null && exec dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq.conf"]
