# dnsmasq — lab name resolution (optional 'dns' compose profile).
# Names come from monitoring/dnsmasq/hosts, e.g. spine1.lab.internal.
domain-needed
bogus-priv
no-resolv
no-hosts
# Upstream resolvers (on EC2 you can use the VPC resolver 169.254.169.253 instead)
server=1.1.1.1
server=8.8.8.8
domain=lab.internal
local=/lab.internal/
addn-hosts=/etc/hosts.lab
log-queries
