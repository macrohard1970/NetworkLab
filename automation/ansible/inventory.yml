---
# Ansible inventory — NetworkLab (topology.clab.yml)
#
# Inventory names are the Containerlab node names. Ansible connects with
# `docker exec` (community.docker.docker) to the containers clab-netlab-<name>,
# because the FRR and Alpine images have no SSH server.
#
# Usage (from automation/ansible, on the Containerlab host):
#   ansible-galaxy collection install -r requirements.yml
#   ansible -i inventory.yml routers -m ping
#   ansible-playbook -i inventory.yml playbooks/deploy-configs.yml

all:
  vars: {ansible_connection: community.docker.docker, ansible_host: 'clab-netlab-{{ inventory_hostname }}', ansible_user: root, ansible_python_interpreter: /usr/bin/python3, frr_vtysh: vtysh,
    mgmt_subnet: 10.255.255.0/24, loopback_subnet: 10.255.0.0/24, underlay_subnet: 10.99.0.0/24, host_network: 10.10.0.0/16,
    services_subnet: 10.20.0.0/24, ping_target: 10.10.3.1}
  children:
    spines:
      hosts:
        spine1: {router_id: 10.255.0.1, asn: 65001, role: spine, mgmt_ip: 10.255.255.11}
        spine2: {router_id: 10.255.0.2, asn: 65001, role: spine, mgmt_ip: 10.255.255.12}
    leaves:
      hosts:
        leaf1:
          router_id: 10.255.0.11
          asn: 65101
          role: leaf
          host_subnet: 10.10.1.0/24
          host_gateway: 10.10.1.254
          uplinks:
          - {interface: eth1, peer: spine1, ip: 10.99.0.1/31}
          - {interface: eth2, peer: spine2, ip: 10.99.0.9/31}
          downlink: {interface: eth3, ip: 10.10.1.254/24}
          mgmt_ip: 10.255.255.21
        leaf2:
          router_id: 10.255.0.12
          asn: 65102
          role: leaf
          host_subnet: 10.10.2.0/24
          host_gateway: 10.10.2.254
          uplinks:
          - {interface: eth1, peer: spine1, ip: 10.99.0.3/31}
          - {interface: eth2, peer: spine2, ip: 10.99.0.11/31}
          downlink: {interface: eth3, ip: 10.10.2.254/24}
          mgmt_ip: 10.255.255.22
        leaf3:
          router_id: 10.255.0.13
          asn: 65103
          role: leaf
          host_subnet: 10.10.3.0/24
          host_gateway: 10.10.3.254
          uplinks:
          - {interface: eth1, peer: spine1, ip: 10.99.0.5/31}
          - {interface: eth2, peer: spine2, ip: 10.99.0.13/31}
          downlink: {interface: eth3, ip: 10.10.3.254/24}
          mgmt_ip: 10.255.255.23
        leaf4:
          router_id: 10.255.0.14
          asn: 65104
          role: leaf
          host_subnet: 10.10.4.0/24
          host_gateway: 10.10.4.254
          uplinks:
          - {interface: eth1, peer: spine1, ip: 10.99.0.7/31}
          - {interface: eth2, peer: spine2, ip: 10.99.0.15/31}
          downlink: {interface: eth3, ip: 10.10.4.254/24}
          mgmt_ip: 10.255.255.24
    routers:
      children:
        spines: {}
        leaves: {}
    hosts_group:
      hosts:
        host-a: {data_ip: 10.10.1.1, data_subnet: 10.10.1.0/24, gateway: 10.10.1.254, leaf: leaf1, mgmt_ip: 10.255.255.31}
        host-b: {data_ip: 10.10.2.1, data_subnet: 10.10.2.0/24, gateway: 10.10.2.254, leaf: leaf2, mgmt_ip: 10.255.255.32}
        host-c: {data_ip: 10.10.3.1, data_subnet: 10.10.3.0/24, gateway: 10.10.3.254, leaf: leaf3, mgmt_ip: 10.255.255.33}
        host-d: {data_ip: 10.10.4.1, data_subnet: 10.10.4.0/24, gateway: 10.10.4.254, leaf: leaf4, mgmt_ip: 10.255.255.34}
