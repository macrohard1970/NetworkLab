---
# Spines: AS 65001, iBGP to the peer spine, eBGP to all four leaves.
# eBGP re-advertises routes, so no route reflection is used.
spine_asn: 65001
route_reflector: false
leaf_peers:
  - {ip: 10.255.0.11, asn: 65101, name: leaf1}
  - {ip: 10.255.0.12, asn: 65102, name: leaf2}
  - {ip: 10.255.0.13, asn: 65103, name: leaf3}
  - {ip: 10.255.0.14, asn: 65104, name: leaf4}
